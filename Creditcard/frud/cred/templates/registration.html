<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShieldGuard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Consolas', monospace;
            background: #0a1621;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 40%, rgba(0, 255, 170, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(0, 255, 170, 0.05) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        .registration-container {
            background: rgba(15, 30, 45, 0.95);
            border: 3px solid #00ffaa;
            border-radius: 8px;
            padding: 60px 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 255, 170, 0.2);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            color: #00ffaa;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(0, 255, 170, 0.6);
        }

        .tagline {
            color: #b0b0b0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        h1 {
            color: #00ffaa;
            font-size: 36px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #b0b0b0;
            font-size: 15px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            color: #b0b0b0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            background: rgba(10, 22, 33, 0.8);
            border: 2px solid rgba(0, 255, 170, 0.3);
            color: #e0e0e0;
            padding: 15px 18px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #00ffaa;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.3);
            background: rgba(10, 22, 33, 0.95);
        }

        input::placeholder {
            color: #6a6a6a;
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: rgba(0, 255, 170, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            background: #00ffaa;
            transition: width 0.3s ease;
        }

        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 30px;
            font-size: 13px;
            color: #b0b0b0;
            line-height: 1.6;
        }

        .terms-checkbox input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #00ffaa;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .terms-checkbox a {
            color: #00ffaa;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .terms-checkbox a:hover {
            color: #00dd88;
            text-decoration: underline;
        }

        .register-btn {
            width: 100%;
            background: #00ffaa;
            color: #0a1621;
            padding: 16px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
        }

        .register-btn:hover {
            background: #00dd88;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.6);
            transform: translateY(-2px);
        }

        .register-btn:disabled {
            background: rgba(0, 255, 170, 0.3);
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(0, 255, 170, 0.3);
        }

        .divider::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(0, 255, 170, 0.3);
        }

        .divider span {
            color: #808080;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-link {
            text-align: center;
            color: #b0b0b0;
            font-size: 14px;
        }

        .login-link a {
            color: #00ffaa;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #00dd88;
            text-decoration: underline;
        }

        .security-features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(0, 255, 170, 0.2);
        }

        .security-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #808080;
        }

        .security-item::before {
            content: '✓';
            color: #00ffaa;
            font-weight: bold;
            font-size: 14px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #808080;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .registration-container {
                padding: 50px 35px;
            }

            .logo {
                font-size: 38px;
            }

            h1 {
                font-size: 28px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .security-features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="registration-container">
        <div class="logo-section">
            <div class="logo">SHIELDGUARD</div>
            <p class="tagline">Credit Card Fraud Detection</p>
        </div>

        <h1>Create Account</h1>
        <p class="subtitle">
            Join thousands protecting their transactions with AI
        </p>

        <form id="registrationForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="John" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="company">Company Name (Optional)</label>
                <input type="text" id="company" name="company" placeholder="Your Company Inc.">
            </div>

            <div class="terms-checkbox">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms" style="text-transform: none; font-size: 13px;">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>. 
                    I understand that ShieldGuard will use AI to analyze transaction patterns for fraud detection.
                </label>
            </div>

            <button type="submit" class="register-btn" id="submitBtn">Create Account</button>

            <div class="security-features">
                <div class="security-item">256-bit Encryption</div>
                <div class="security-item">GDPR Compliant</div>
                <div class="security-item">SOC 2 Certified</div>
                <div class="security-item">24/7 Monitoring</div>
            </div>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <p class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </p>

        <footer>
            <p>&copy; 2024 ShieldGuard - Your security is our priority</p>
        </footer>
    </div>

    <script>
        // Password strength indicator
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;

            if (password.length >= 8) strength += 25;
            if (password.match(/[a-z]+/)) strength += 25;
            if (password.match(/[A-Z]+/)) strength += 25;
            if (password.match(/[0-9]+/)) strength += 25;

            strengthBar.style.width = strength + '%';
            
            if (strength <= 25) {
                strengthBar.style.background = '#ff4444';
            } else if (strength <= 50) {
                strengthBar.style.background = '#ffaa00';
            } else if (strength <= 75) {
                strengthBar.style.background = '#00aaff';
            } else {
                strengthBar.style.background = '#00ffaa';
            }
        });

        // Form submission handler
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            // Validate passwords match
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            // Validate terms
            if (!terms) {
                alert('Please accept the terms and conditions');
                return;
            }

            // Validate password strength
            if (password.length < 8) {
                alert('Password must be at least 8 characters long');
                return;
            }

            // In production, this would connect to backend
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            // Simulate API call
            setTimeout(() => {
                alert('Registration successful! Redirecting to dashboard...');
                // window.location.href = 'dashboard.html';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }, 2000);
        });
    </script>
</body>
</html>
